<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Tower Stacker: MEGA HYPE</title>
    
    <!-- 1. ПОДКЛЮЧЕНИЕ TELEGRAM WEBAPP API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #FDE2E4; 
            --text: #5D576B; 
            --accent: #FF9F1C; 
            /* Безопасные отступы для вырезов экрана (iPhone и т.д.) */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: var(--bg); font-family: 'Rubik', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
            transition: background 1s ease;
            /* Учитываем безопасные зоны */
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        canvas { display: block; }

        /* === UI LAYER === */
        #ui-layer {
            position: absolute; inset: 0;
            pointer-events: none; display: flex;
            flex-direction: column; align-items: center;
            padding: 20px 0; z-index: 10;
        }
        #score-container {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255,255,255,0.55); backdrop-filter: blur(12px);
            padding: 8px 36px; border-radius: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }
        #score {
            color: var(--text); font-size: 72px; font-weight: 900;
            line-height: 1; transition: transform 0.1s, color 0.2s;
        }
        #high-score { color: #8A84A0; font-size: 14px; font-weight: 700; margin-top: 4px; letter-spacing: 1px; }
        #timer { color: #EF476F; font-size: 28px; font-weight: 900; display: none; margin-top: 4px; }
        #mode-label { color: #8A84A0; font-size: 11px; font-weight: 700; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
        .score-pop { transform: scale(1.18); color: var(--accent) !important; }

        /* === QUESTS PANEL === */
        #quests {
            position: absolute; top: 20px; left: 15px;
            display: flex; flex-direction: column; gap: 6px;
            max-width: 150px;
        }
        .quest-chip {
            background: rgba(255,255,255,0.65); backdrop-filter: blur(8px);
            padding: 6px 12px; border-radius: 12px;
            font-size: 12px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.6);
            transition: all 0.3s;
        }
        .quest-chip.done { background: rgba(6,214,160,0.9); color: white; }

        /* === MUTE BTN === */
        #mute-btn {
            position: absolute; top: 20px; right: 15px;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.65); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.6);
            font-size: 24px; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
        }

        /* === POPUPS === */
        .popup-text {
            position: absolute; font-weight: 900; text-align: center;
            opacity: 0; pointer-events: none; text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 4px 15px rgba(0,0,0,0.15);
            left: 50%; transform: translateX(-50%) translateY(20px) scale(0.8);
            width: 100%; z-index: 15;
        }
        #perfect-text { color: #06D6A0; font-size: 40px; top: 25%; }
        #combo-text { color: #EF476F; font-size: 60px; top: 12%; }
        #milestone-text { color: #118AB2; font-size: 50px; top: 35%; }
        #bonus-text { color: #FF9F1C; font-size: 35px; top: 40%; }
        .show-popup { opacity: 1 !important; transform: translateX(-50%) translateY(0) scale(1.1) !important; }

        /* === START SCREEN === */
        #start-screen {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #FDE2E4 0%, #E2ECE9 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: var(--text); z-index: 100; pointer-events: auto;
            padding: 20px; text-align: center;
        }
        #start-screen h1 { font-size: 42px; margin: 0 0 8px 0; font-weight: 900; line-height: 1.1;}
        #start-screen p { font-size: 16px; color: #8A84A0; margin: 0 0 30px 0; }
        .mode-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
        .mode-btn {
            background: white; color: var(--text);
            border: 2px solid transparent; padding: 16px 20px;
            border-radius: 20px; cursor: pointer;
            font-family: 'Rubik', sans-serif;
            display: flex; align-items: center; gap: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }
        .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.12); }
        .mode-btn:active { transform: translateY(0); }
        .mode-btn .mode-icon { font-size: 32px; }
        .mode-btn .mode-info { text-align: left; }
        .mode-btn .mode-name { font-size: 18px; font-weight: 900; display: block; }
        .mode-btn .mode-desc { font-size: 13px; color: #8A84A0; }

        /* === GAME OVER === */
        #game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text); text-align: center;
            display: none; background: rgba(255,255,255,0.95);
            padding: 30px 35px; border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            pointer-events: auto; cursor: pointer;
            backdrop-filter: blur(20px); border: 2px solid white;
            z-index: 20; width: 90%; max-width: 380px;
            max-height: 90vh; overflow-y: auto;
        }
        #game-over h1 { margin: 0 0 6px 0; font-size: 28px; color: #EF476F; font-weight: 900;}
        #game-over p { margin: 0; font-size: 15px; color: #8A84A0; }
        .final-score { font-size: 64px; color: var(--text); font-weight: 900; margin: 6px 0; }
        #new-record {
            color: var(--accent); font-size: 16px; font-weight: 900;
            display: none; margin-bottom: 6px; text-transform: uppercase;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        #leaderboard-mini { margin-top: 15px; text-align: left; background: rgba(0,0,0,0.04); padding: 10px 15px; border-radius: 12px; }
        #leaderboard-mini h3 { margin: 0 0 8px 0; font-size: 13px; color: #8A84A0; text-transform: uppercase; }
        #leaderboard-list { list-style: none; padding: 0; margin: 0; font-size: 14px; font-weight: 700; }
        #leaderboard-list li { padding: 3px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); }
        #leaderboard-list li:last-child { border-bottom: none; }
        #leaderboard-list .rank { color: #FF9F1C; margin-right: 6px; }
        #leaderboard-list .date { color: #8A84A0; font-size: 11px; font-weight: 500; }
        
        .gameover-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-row { display: flex; gap: 10px; }
        .btn-row button, #menu-btn {
            flex: 1; border: none; padding: 14px 16px;
            font-family: 'Rubik', sans-serif; font-weight: 900;
            font-size: 14px; border-radius: 15px; cursor: pointer;
            transition: all 0.2s; pointer-events: auto;
        }
        #share-btn { background: #3498db; color: white; box-shadow: 0 6px 15px rgba(52,152,219,0.3); }
        #share-btn:hover { background: #2980b9; }
        #restart-btn { background: #06D6A0; color: white; box-shadow: 0 6px 15px rgba(6,214,160,0.3); }
        #restart-btn:hover { background: #05b98a; }
        #menu-btn { background: #8A84A0; color: white; width: 100%; box-shadow: 0 6px 15px rgba(138,132,160,0.3); }
        #menu-btn:hover { background: #727089; }

        /* === TUTORIAL === */
        #tutorial {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            background: rgba(93,87,107,0.92); color: white;
            padding: 14px 24px; border-radius: 20px;
            font-weight: 700; font-size: 15px; text-align: center;
            display: none; z-index: 15; pointer-events: none;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-8px); } }

        /* === SHARE MODAL === */
        #share-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 200; padding: 20px; flex-direction: column; gap: 15px;
        }
        #share-modal img { max-width: 90%; max-height: 70vh; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #share-modal .share-actions { display: flex; gap: 10px; }
        #share-modal button {
            padding: 12px 30px; border: none; border-radius: 15px;
            font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 16px;
            cursor: pointer; color: white;
        }
        #share-download { background: #06D6A0; }
        #share-close { background: #EF476F; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

<div id="ui-layer">
    <div id="quests"></div>
    <button id="mute-btn">🔊</button>
    <div id="score-container">
        <div id="score">0</div>
        <div id="high-score">РЕКОРД: 0</div>
        <div id="timer">⏱ 60</div>
        <div id="mode-label">КЛАССИКА</div>
    </div>
    <div id="combo-text" class="popup-text">КОМБО x2</div>
    <div id="perfect-text" class="popup-text">ИДЕАЛЬНО</div>
    <div id="bonus-text" class="popup-text">БОНУС</div>
    <div id="milestone-text" class="popup-text">10 ЭТАЖЕЙ</div>
    <div id="tutorial">Нажми, когда блок будет ровно над башней!</div>
</div>

<div id="game-over">
    <h1>БАШНЯ РУХНУЛА</h1>
    <div id="new-record">🏆 НОВЫЙ РЕКОРД!</div>
    <p>Твой результат:</p>
    <div class="final-score" id="final-score-val">0</div>
    <div id="leaderboard-mini">
        <h3>🏆 ТОП 5</h3>
        <ol id="leaderboard-list"></ol>
    </div>
    <div class="gameover-buttons">
        <div class="btn-row">
            <button id="share-btn">📸 ПОДЕЛИТЬСЯ</button>
            <button id="restart-btn">🔄 ЗАНОВО</button>
        </div>
        <button id="menu-btn">🏠 В ГЛАВНОЕ МЕНЮ</button>
    </div>
</div>

<div id="start-screen">
    <h1>🏗️ СТРОЙ БАШНЮ<br>МЕГА-ХАЙПА</h1>
    <p>Выбери режим и начни строить!</p>
    <div class="mode-buttons">
        <button class="mode-btn" data-mode="classic">
            <span class="mode-icon">🎮</span>
            <div class="mode-info"><span class="mode-name">Классика</span><span class="mode-desc">Без ограничений по времени</span></div>
        </button>
        <button class="mode-btn" data-mode="time">
            <span class="mode-icon">⏱</span>
            <div class="mode-info"><span class="mode-name">На время</span><span class="mode-desc">60 секунд, +2 сек за идеал</span></div>
        </button>
        <button class="mode-btn" data-mode="zen">
            <span class="mode-icon">🧘</span>
            <div class="mode-info"><span class="mode-name">Дзен</span><span class="mode-desc">Без проигрыша, для расслабления</span></div>
        </button>
    </div>
</div>

<div id="share-modal">
    <img id="share-img" alt="Результат">
    <div class="share-actions">
        <button id="share-download">💾 СКАЧАТЬ</button>
        <button id="share-close">✖ ЗАКРЫТЬ</button>
    </div>
</div>

<script type="module">
import * as THREE from 'three';

// ==========================================
// 2. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
// ==========================================
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready(); // Сообщаем Telegram, что приложение загружено
    tg.expand(); // Разворачиваем игру на весь экран
    // Отключаем случайные свайпы вниз (чтобы игра не сворачивалась)
    if (tg.isVersionAtLeast('7.7')) {
        tg.disableVerticalSwipes();
    }
    
    // Синхронизация изменения размера окна с Telegram
    tg.onEvent('viewportChanged', () => {
        if (typeof onResize === 'function') onResize();
    });
}

// Универсальная функция вибрации (Telegram + обычный браузер)
function triggerHaptic(type = 'light') {
    if (tg?.HapticFeedback) {
        if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
    } else if (navigator.vibrate) {
        if (type === 'error') navigator.vibrate([100, 50, 100]);
        else navigator.vibrate(50);
    }
}

// ============ НАСТРОЙКИ ============
const BLOCK_SIZE = 4, BLOCK_HEIGHT = 1;
const BASE_SPEED = 0.16, MAX_SPEED = 0.45, MIN_SIZE = 1.2;

const COLORS = ['#FF9F1C','#FFBF69','#2EC4B6','#CBF3F0','#FF6B6B','#A06CD5','#F9C74F','#90BE6D'];
const EMOJIS = ['🍕','🚀','🤡','💩','👽','🐱','🍔','🍩','🔥','🥴','🐷','🎉','🦄','🍦'];
const TEXTS = ['ХАЙП','БОРЩ','ДОДО','КЕФИР','ПЕЛЬМЕНИ','СОСИС','ШКОЛА','МАМА','ПАПА','СПИРТ','ЧЕБУРЕК','ЛУК','СОК'];

const BIOMES = [
    { bg: '#FDE2E4' }, { bg: '#E2ECE9' }, { bg: '#D0E6F9' },
    { bg: '#F9E2D0' }, { bg: '#2B2D42' }
];

// ============ STATE ============
let scene, camera, renderer, musicGain;
let blocks = [], debris = [], confetti = [];
let currentBlock, direction = 1;
let score = 0, combo = 0, maxComboThisGame = 0;
let highScore = parseInt(localStorage.getItem('towerHighScore')) || 0;
let gameState = 'menu';
let gameMode = 'classic';
let movingAxis = 'x', currentSpeed = BASE_SPEED;
let currentBiomeIndex = 0;
let targetBgColor = new THREE.Color(BIOMES[0].bg);
let shakeIntensity = 0;
let timeLeft = 60, timeAttackTimer = null;
let showTutorialHint = !localStorage.getItem('towerTutorialShown');
let captureNext = false;
let isMuted = localStorage.getItem('towerMuted') === 'true';
let clock = new THREE.Clock();

// Quests
let quests = [];
const QUESTS_POOL = [
    { type: 'perfect', target: 5, text: '🎯 5 идеальных' },
    { type: 'perfect', target: 10, text: '🎯 10 идеальных' },
    { type: 'stack', target: 15, text: '🏗️ 15 этажей' },
    { type: 'stack', target: 25, text: '🏗️ 25 этажей' },
    { type: 'combo', target: 3, text: '🔥 Комбо x3' },
    { type: 'combo', target: 5, text: '🔥 Комбо x5' },
    { type: 'cut', target: 10, text: '✂️ 10 обрезков' },
    { type: 'games', target: 3, text: '🎮 3 игры' },
];

let leaderboard = JSON.parse(localStorage.getItem('towerLeaderboard') || '[]');

// ============ UI ============
const $ = id => document.getElementById(id);
const scoreEl = $('score'), highScoreEl = $('high-score');
const gameOverEl = $('game-over'), startScreen = $('start-screen');
const perfectText = $('perfect-text'), comboText = $('combo-text');
const milestoneText = $('milestone-text'), bonusText = $('bonus-text');
const finalScoreVal = $('final-score-val'), newRecordEl = $('new-record');
const timerEl = $('timer'), modeLabel = $('mode-label');
const questsEl = $('quests'), muteBtn = $('mute-btn');
const tutorialEl = $('tutorial');
const shareModal = $('share-modal'), shareImg = $('share-img');

highScoreEl.innerText = `РЕКОРД: ${highScore}`;

// ============ AUDIO ============
let audioCtx = null, noiseBuffer = null;
let musicPlaying = false, musicBeat = 0, musicTempo = 110, musicTimeout = null;

function initAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const size = audioCtx.sampleRate * 0.1;
            noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
            
            musicGain = audioCtx.createGain();
            musicGain.gain.value = 0.12;
            musicGain.connect(audioCtx.destination);
        } catch(e) { console.warn('Audio not supported'); }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type, level = 0) {
    if (isMuted || !audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime;
    const master = audioCtx.createGain();
    master.connect(audioCtx.destination);

    const tone = (freq, endFreq, wave, dur, vol, delay = 0) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + delay);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + delay + dur);
        filter.type = 'lowpass'; filter.frequency.value = 2000;
        g.gain.setValueAtTime(0, now + delay);
        g.gain.linearRampToValueAtTime(vol, now + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
        osc.connect(filter); filter.connect(g); g.connect(master);
        osc.start(now + delay); osc.stop(now + delay + dur);
    };

    const noise = (dur, vol, delay = 0) => {
        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        const g = audioCtx.createGain();
        filter.type = 'lowpass'; filter.frequency.value = 800;
        g.gain.setValueAtTime(vol, now + delay);
        g.gain.exponentialRampToValueAtTime(0.01, now + delay + dur);
        src.connect(filter); filter.connect(g); g.connect(master);
        src.start(now + delay);
    };

    if (type === 'drop') { tone(90, 40, 'sine', 0.15, 0.35); noise(0.05, 0.15); }
    else if (type === 'perfect') {
        const mult = Math.pow(1.059, Math.min(level, 12));
        tone(523.25 * mult, null, 'sine', 0.4, 0.25);
        tone(659.25 * mult, null, 'sine', 0.4, 0.18);
    }
    else if (type === 'milestone') {
        [261.63, 329.63, 392.00, 523.25].forEach((f, i) => tone(f, null, 'triangle', 0.5, 0.12, i * 0.1));
    }
    else if (type === 'bomb') {
        noise(0.4, 0.4);
        tone(120, 30, 'sawtooth', 0.4, 0.3);
    }
    else if (type === 'gameover') {
        tone(200, 80, 'triangle', 0.8, 0.25);
        tone(150, 60, 'triangle', 0.8, 0.18, 0.1);
    }
    else if (type === 'quest') {
        tone(659.25, null, 'sine', 0.2, 0.2);
        tone(783.99, null, 'sine', 0.3, 0.2, 0.1);
        tone(1046.5, null, 'sine', 0.4, 0.2, 0.2);
    }
}

function playKick() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(musicGain);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}

function playHat() {
    if (!audioCtx) return;
    const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 6000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
    src.connect(filter); filter.connect(g); g.connect(musicGain);
    src.start(); src.stop(audioCtx.currentTime + 0.04);
}

function musicTick() {
    if (!musicPlaying || isMuted) return;
    const beat = musicBeat % 4;
    if (beat === 0 || beat === 2) playKick();
    if (beat === 1 || beat === 3) playHat();
    musicBeat++;
    musicTimeout = setTimeout(musicTick, (60000 / musicTempo) / 2);
}

function startMusic() {
    if (musicPlaying || isMuted) return;
    initAudio(); if (!audioCtx) return;
    musicPlaying = true; musicBeat = 0;
    musicTempo = 110;
    musicTick();
}

function stopMusic() {
    musicPlaying = false;
    if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; }
}

muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    localStorage.setItem('towerMuted', isMuted);
    muteBtn.innerText = isMuted ? '🔇' : '🔊';
    if (isMuted) stopMusic(); else if (gameState === 'playing') startMusic();
});
muteBtn.innerText = isMuted ? '🔇' : '🔊';

// ============ QUESTS ============
function loadQuests() {
    const today = new Date().toDateString();
    const saved = JSON.parse(localStorage.getItem('towerQuests') || 'null');
    if (saved && saved.date === today && saved.quests?.length) {
        quests = saved.quests;
    } else {
        const pool = [...QUESTS_POOL];
        quests = [];
        for (let i = 0; i < 3; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            const q = pool.splice(idx, 1)[0];
            quests.push({ ...q, current: 0, done: false });
        }
        saveQuests();
    }
    renderQuests();
}

function saveQuests() {
    localStorage.setItem('towerQuests', JSON.stringify({
        date: new Date().toDateString(),
        quests
    }));
}

function updateQuest(type, value, isMax = false) {
    let changed = false;
    quests.forEach(q => {
        if (q.done || q.type !== type) return;
        if (isMax) {
            if (value > q.current) { q.current = Math.min(q.target, value); changed = true; }
        } else {
            q.current = Math.min(q.target, q.current + value); changed = true;
        }
        if (q.current >= q.target && !q.done) {
            q.done = true;
            playSound('quest');
            showPopup(bonusText, '🎁 КВЕСТ!', 1200);
            triggerHaptic('success');
        }
    });
    if (changed) { saveQuests(); renderQuests(); }
}

function renderQuests() {
    questsEl.innerHTML = '';
    quests.forEach(q => {
        const chip = document.createElement('div');
        chip.className = 'quest-chip' + (q.done ? ' done' : '');
        chip.textContent = q.done ? '✅ ' + q.text : `${q.text} ${q.current}/${q.target}`;
        questsEl.appendChild(chip);
    });
}

function initThree() {

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));

function disposeMesh(mesh) {
    if (!mesh) return;
    if (mesh.geometry) mesh.geometry.dispose();
    if (Array.isArray(mesh.material)) mesh.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    else if (mesh.material) { if (mesh.material.map) mesh.material.map.dispose(); mesh.material.dispose(); }
}

// ============ TEXTURES & BLOCKS ============
function createTexture(emoji, text, color, type = 'normal') {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    
    if (type === 'golden') {
        const grad = ctx.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, '#FFD700'); grad.addColorStop(0.5, '#FFF8DC'); grad.addColorStop(1, '#DAA520');
        ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 15; ctx.strokeRect(7.5, 7.5, 241, 241);
    } else if (type === 'bomb') {
        ctx.fillStyle = '#2C3E50'; ctx.fillRect(0,0,256,256);
        ctx.save();
        ctx.beginPath(); ctx.rect(0,0,256,256); ctx.clip();
        ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 30;
        for(let i=-256; i<512; i+=60) {
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+256,256); ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 12; ctx.strokeRect(6,6,244,244);
    } else if (type === 'ice') {
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4;
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.random()*256, 0);
            ctx.lineTo(Math.random()*256, 256);
            ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 15; ctx.strokeRect(7.5,7.5,241,241);
    } else {
        ctx.fillStyle = color; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 10; ctx.strokeRect(5,5,246,246);
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(128, 108, 75, 0, Math.PI*2); ctx.fill();
    ctx.font = '110px Arial'; ctx.fillText(emoji, 128, 108);
    ctx.fillStyle = type === 'golden' ? '#8B6508' : '#fff'; 
    ctx.font = '900 38px "Rubik",sans-serif'; 
    ctx.fillText(text, 128, 220);
    
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
}

function createBlockMesh(w, h, d, color, emoji, text, type = 'normal') {
    const geo = new THREE.BoxGeometry(w, h, d);
    const tex = createTexture(emoji, text, color, type);
    
    let sideOpts = { map: tex, roughness: 0.8 };
    let topOpts = { color: color, roughness: 0.9 };

    if (type === 'golden') {
        sideOpts.emissive = new THREE.Color(0xFFAA00); sideOpts.emissiveIntensity = 0.3;
        topOpts.emissive = new THREE.Color(0xFFAA00); topOpts.emissiveIntensity = 0.3;
    } else if (type === 'bomb') {
        sideOpts.emissive = new THREE.Color(0xFF0000); sideOpts.emissiveIntensity = 0.2;
        topOpts.emissive = new THREE.Color(0xFF0000); topOpts.emissiveIntensity = 0.2;
    } else if (type === 'ice') {
        sideOpts.transparent = true; sideOpts.opacity = 0.85;
        topOpts.transparent = true; topOpts.opacity = 0.85;
    }

    const side = new THREE.MeshStandardMaterial(sideOpts);
    const top = new THREE.MeshStandardMaterial(topOpts);
    
    const mesh = new THREE.Mesh(geo, [side, side, top, top, side, side]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.blockType = type;
    return mesh;
}

function rollBlockType() {
    if (score < 5) return 'normal';
    const r = Math.random();
    if (r < 0.08) return 'golden';
    if (r < 0.16) return 'bomb';
    if (r < 0.24) return 'ice';
    return 'normal';
}

function getBlockVisuals(type, fallbackColor, fallbackEmoji, fallbackText) {
    switch(type) {
        case 'golden': return { color: '#FFD700', emoji: '👑', text: 'ЗОЛОТО' };
        case 'bomb': return { color: '#2C3E50', emoji: '💣', text: 'БУМ' };
        case 'ice': return { color: '#87CEEB', emoji: '❄️', text: 'ЛЕД' };
        default: return { color: fallbackColor, emoji: fallbackEmoji, text: fallbackText };
    }
}

function createBaseBlock() {
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const text = TEXTS[Math.floor(Math.random() * TEXTS.length)];
    const base = createBlockMesh(BLOCK_SIZE, BLOCK_HEIGHT, BLOCK_SIZE, color, emoji, text, 'normal');
    base.position.set(0, 0, 0);
    scene.add(base); blocks.push(base);
    spawnNewBlock();
}

function spawnNewBlock() {
    const top = blocks[blocks.length - 1];
    movingAxis = blocks.length % 2 === 1 ? 'x' : 'z';

    const blockType = rollBlockType();
    const baseColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    const baseEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const baseText = TEXTS[Math.floor(Math.random() * TEXTS.length)];
    const { color, emoji, text } = getBlockVisuals(blockType, baseColor, baseEmoji, baseText);

    const w = top.geometry.parameters.width;
    const d = top.geometry.parameters.depth;

    let sx = top.position.x, sz = top.position.z;
    if (movingAxis === 'x') sx = direction === 1 ? -15 : 15;
    else sz = direction === 1 ? -15 : 15;

    currentBlock = createBlockMesh(w, BLOCK_HEIGHT, d, color, emoji, text, blockType);
    currentBlock.position.set(sx, top.position.y + BLOCK_HEIGHT, sz);
    currentBlock.userData = { w, d, moving: true, color, emoji, text, blockType };
    scene.add(currentBlock);
}

// ============ GAME LOGIC ============
function dropBlock() {
    if (gameState !== 'playing' || !currentBlock?.userData.moving) return;

    if (showTutorialHint) {
        tutorialEl.style.display = 'none';
        localStorage.setItem('towerTutorialShown', 'true');
        showTutorialHint = false;
    }

    currentBlock.userData.moving = false;
    const top = blocks[blocks.length - 1];
    const diff = currentBlock.position[movingAxis] - top.position[movingAxis];
    const size = currentBlock.geometry.parameters[movingAxis === 'x' ? 'width' : 'depth'];
    const absDiff = Math.abs(diff);
    const bType = currentBlock.userData.blockType;

    shakeIntensity = Math.min(0.25, absDiff * 0.1);

    // === ZEN MODE SPECIAL HANDLING ===
    if (gameMode === 'zen' && absDiff >= size / 2) {
        const newSize = Math.max(MIN_SIZE, size * 0.85);
        currentBlock.position[movingAxis] = top.position[movingAxis];
        const w = movingAxis === 'x' ? newSize : currentBlock.userData.w;
        const d = movingAxis === 'z' ? newSize : currentBlock.userData.d;
        scene.remove(currentBlock); disposeMesh(currentBlock);
        const nm = createBlockMesh(w, BLOCK_HEIGHT, d, currentBlock.userData.color, currentBlock.userData.emoji, currentBlock.userData.text, 'normal');
        nm.position.copy(currentBlock.position);
        nm.userData = { ...currentBlock.userData, w, d, blockType: 'normal' };
        currentBlock = nm;
        combo = 0;
        score++;
        updateScoreUI();
        blocks.push(currentBlock); scene.add(currentBlock);
        spawnNewBlock();
        return;
    }

    // === GAME OVER (non-zen) ===
    if (absDiff >= size / 2) {
        currentBlock.userData.falling = true;
        triggerGameOver();
        return;
    }

    // === PERFECT PLACEMENT ===
    if (absDiff < 0.15) {
        currentBlock.position[movingAxis] = top.position[movingAxis];
        combo++;
        maxComboThisGame = Math.max(maxComboThisGame, combo);

        let points = 1;
        if (bType === 'golden') points = 3;
        else if (bType === 'bomb') points = 2;
        else if (bType === 'ice') points = 2;

        if (bType === 'bomb') {
            playSound('bomb');
            showPopup(bonusText, '💥 БУМ! +2', 1000);
            shakeIntensity = 0.5;
        } else {
            playSound('perfect', combo);
        }

        if (gameMode === 'time') { timeLeft += 2; updateTimerDisplay(); }

        if (bType === 'golden') showPopup(bonusText, '👑 ЗОЛОТО +3', 900);
        else if (bType !== 'bomb') showPopup(perfectText, null, 600);

        if (combo > 1) showPopup(comboText, `КОМБО x${combo}`, 800);

        updateQuest('perfect', 1);
        updateQuest('combo', combo, true);
        
        triggerHaptic('light'); // Вибрация за идеальное попадание

        const oldScore = score;
        score += points;
        checkMilestone(oldScore, score);

        triggerPerfectParticles();
    } else {
        // === CUT ===
        combo = 0;
        updateQuest('cut', 1);

        if (bType === 'bomb') {
            score = Math.max(0, score - 1);
            playSound('bomb');
            shakeIntensity = 0.5;
            showPopup(bonusText, '💣 -1 ОЧКО', 900);
            spawnBombParticles();
            triggerHaptic('error'); // Сильная вибрация за бомбу
        } else {
            playSound('drop');
            triggerHaptic('light'); // Легкая вибрация за обрезку
        }

        const newSize = size - absDiff;
        createDebris(diff, size, newSize, movingAxis, top);

        const w = movingAxis === 'x' ? newSize : currentBlock.userData.w;
        const d = movingAxis === 'z' ? newSize : currentBlock.userData.d;
        scene.remove(currentBlock); disposeMesh(currentBlock);

        const nm = createBlockMesh(w, BLOCK_HEIGHT, d, currentBlock.userData.color, currentBlock.userData.emoji, currentBlock.userData.text, 'normal');
        if (movingAxis === 'x') {
            nm.position.set(top.position.x + (diff > 0 ? (size-newSize)/2 : -(size-newSize)/2), currentBlock.position.y, currentBlock.position.z);
        } else {
            nm.position.set(currentBlock.position.x, currentBlock.position.y, top.position.z + (diff > 0 ? (size-newSize)/2 : -(size-newSize)/2));
        }
        nm.userData = { ...currentBlock.userData, w, d, blockType: 'normal' };
        currentBlock = nm;

        if (bType !== 'bomb') score++;
    }

    updateScoreUI();
    currentSpeed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.004);
    musicTempo = Math.min(160, 110 + Math.floor(score / 10) * 5);

    blocks.push(currentBlock);
    scene.add(currentBlock);
    spawnNewBlock();
}

function updateScoreUI() {
    scoreEl.innerText = score;
    scoreEl.classList.add('score-pop');
    setTimeout(() => scoreEl.classList.remove('score-pop'), 150);
    updateQuest('stack', score, true);
}

function checkMilestone(oldScore, newScore) {
    const oldM = Math.floor(oldScore / 10);
    const newM = Math.floor(newScore / 10);
    if (newM > oldM) triggerMilestone(newM * 10);
}

// ============ EFFECTS ============
function triggerPerfectParticles() {
    currentBlock.material.forEach(m => {
        if (m.emissive) {
            m.emissive.setHex(0x444444);
            setTimeout(() => m.emissive.setHex(0x000000), 200);
        }
    });
    for (let i = 0; i < 12; i++) {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0x06D6A0 })
        );
        p.position.copy(currentBlock.position);
        p.position.y += 0.5;
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.6, Math.random()*0.6+0.2, (Math.random()-0.5)*0.6), life: 1.0 };
        scene.add(p); debris.push(p);
    }
}

function spawnBombParticles() {
    for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.15, 6, 6),
            new THREE.MeshBasicMaterial({ color: i % 2 ? 0xE74C3C : 0xFF9F1C })
        );
        p.position.copy(currentBlock.position);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*1.2, Math.random()*0.8+0.3, (Math.random()-0.5)*1.2), life: 1.0 };
        scene.add(p); debris.push(p);
    }
}

function triggerMilestone(points) {
    playSound('milestone');
    triggerHaptic('success');
    
    const newBiome = Math.floor(points / 10) % BIOMES.length;
    currentBiomeIndex = newBiome;
    targetBgColor.set(BIOMES[newBiome].bg);
    document.body.style.background = BIOMES[newBiome].bg;

    showPopup(milestoneText, `${points} ЭТАЖЕЙ!`, 1500);

    const topPos = blocks[blocks.length - 1].position;
    for (let i = 0; i < 40; i++) {
        const piece = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.2, 0.02),
            new THREE.MeshBasicMaterial({ color: COLORS[Math.floor(Math.random() * COLORS.length)] })
        );
        piece.position.set(topPos.x + (Math.random()-0.5)*2, topPos.y + 2, topPos.z + (Math.random()-0.5)*2);
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.3 + 0.1;
        piece.userData = {
            vel: new THREE.Vector3(Math.cos(angle)*speed, Math.random()*0.6+0.3, Math.sin(angle)*speed),
            rotSpeed: new THREE.Vector3(Math.random()*0.3, Math.random()*0.3, Math.random()*0.3)
        };
        scene.add(piece); confetti.push(piece);
    }
}

function createDebris(diff, origSize, newSize, axis, top) {
    const dSize = origSize - newSize;
    const geo = new THREE.BoxGeometry(
        axis === 'x' ? dSize : currentBlock.userData.w,
        BLOCK_HEIGHT,
        axis === 'z' ? dSize : currentBlock.userData.d
    );
    const mat = new THREE.MeshStandardMaterial({ color: currentBlock.userData.color, roughness: 0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;

    let px = currentBlock.position.x, pz = currentBlock.position.z;
    if (axis === 'x') px = diff > 0 ? top.position.x + (origSize/2) + (dSize/2) : top.position.x - (origSize/2) - (dSize/2);
    else pz = diff > 0 ? top.position.z + (origSize/2) + (dSize/2) : top.position.z - (origSize/2) - (dSize/2);

    mesh.position.set(axis === 'x' ? px : currentBlock.position.x, currentBlock.position.y, axis === 'z' ? pz : currentBlock.position.z);
    mesh.userData = {
        vel: new THREE.Vector3(axis === 'x' ? (diff > 0 ? 0.15 : -0.15) : 0, 0.1, axis === 'z' ? (diff > 0 ? 0.15 : -0.15) : 0),
        rotSpeed: new THREE.Vector3((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3)
    };
    scene.add(mesh); debris.push(mesh);
}

// ============ CAMERA ============
function updateCamera() {
    if (!blocks.length) return;
    const top = blocks[blocks.length - 1];
    const ty = top.position.y, tx = top.position.x * 0.5, tz = top.position.z * 0.5;
    camera.position.x += (tx + 20 - camera.position.x) * 0.1;
    camera.position.y += (ty + 25 - camera.position.y) * 0.1;
    camera.position.z += (tz + 20 - camera.position.z) * 0.1;
    camera.lookAt(tx, ty + 2, tz);

    if (shakeIntensity > 0.01) {
        camera.position.x += (Math.random()-0.5) * shakeIntensity;
        camera.position.y += (Math.random()-0.5) * shakeIntensity;
        camera.position.z += (Math.random()-0.5) * shakeIntensity;
        shakeIntensity *= 0.85;
    }
}

// ============ GAME LOOP ============
function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    if (gameState === 'playing' && currentBlock?.userData.moving) {
        let speed = currentSpeed;
        if (currentBlock.userData.blockType === 'ice') speed = Math.min(speed * 1.8, 0.6);

        let delta = speed * direction;
        if (score > 20 && gameMode !== 'zen') {
            delta += Math.sin(performance.now() * 0.003) * 0.02;
        }

        currentBlock.position[movingAxis] += delta;
        if (currentBlock.position[movingAxis] > 15) direction = -1;
        if (currentBlock.position[movingAxis] < -15) direction = 1;

        if (currentBlock.userData.blockType === 'golden' || currentBlock.userData.blockType === 'bomb') {
            const pulse = 0.2 + (Math.sin(time * 8) * 0.2);
            currentBlock.material.forEach(m => {
                if (m.emissive) m.emissiveIntensity = pulse;
            });
        } else if (currentBlock.userData.blockType === 'ice') {
            const pulse = 0.85 + (Math.sin(time * 4) * 0.15);
            currentBlock.material.forEach(m => {
                if (m.transparent) m.opacity = pulse;
            });
        }
    }

    if (currentBlock?.userData.falling) {
        currentBlock.position.y -= 0.3;
        currentBlock.rotation.x += 0.05;
        currentBlock.rotation.z += 0.05;
    }

    for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.position.add(d.userData.vel);
        d.userData.vel.y -= 0.02;
        if (d.userData.rotSpeed) {
            d.rotation.x += d.userData.rotSpeed.x;
            d.rotation.y += d.userData.rotSpeed.y;
            d.rotation.z += d.userData.rotSpeed.z;
        }
        if (d.userData.life !== undefined) {
            d.userData.life -= 0.02;
            d.scale.setScalar(d.userData.life);
            if (d.userData.life <= 0) { scene.remove(d); disposeMesh(d); debris.splice(i, 1); continue; }
        }
        if (d.position.y < camera.position.y - 40) { scene.remove(d); disposeMesh(d); debris.splice(i, 1); }
    }

    for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.position.add(c.userData.vel);
        c.userData.vel.y -= 0.015;
        c.userData.vel.x *= 0.98; c.userData.vel.z *= 0.98;
        c.rotation.x += c.userData.rotSpeed.x;
        c.rotation.y += c.userData.rotSpeed.y;
        c.rotation.z += c.userData.rotSpeed.z;
        if (c.position.y < camera.position.y - 40) { scene.remove(c); disposeMesh(c); confetti.splice(i, 1); }
    }

    if (gameState === 'playing' || gameState === 'gameover') updateCamera();
    scene.background.lerp(targetBgColor, 0.05);

    renderer.render(scene, camera);

    if (captureNext) {
        captureNext = false;
        try {
            const dataURL = generateShareImage();
            shareImg.src = dataURL;
            shareModal.style.display = 'flex';
        } catch (e) {
            console.error('Share failed', e);
            alert('Не удалось создать изображение');
        }
    }
}

// ============ SHARE ============
function generateShareImage() {
    renderer.render(scene, camera);
    const w = 1080, h = 1920;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, BIOMES[currentBiomeIndex].bg);
    grad.addColorStop(1, '#5D576B');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

    const src = renderer.domElement;
    const gameAspect = src.width / src.height;
    const targetAspect = w / h;
    let dw, dh, dx, dy;
    if (gameAspect > targetAspect) { dw = w; dh = w / gameAspect; dx = 0; dy = (h - dh) / 2; }
    else { dh = h; dw = h * gameAspect; dx = (w - dw) / 2; dy = 0; }
    ctx.drawImage(src, dx, dy, dw, dh);

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(60, 100, w - 120, 340);
    ctx.fillStyle = '#5D576B';
    ctx.font = 'bold 240px Rubik, Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(score.toString(), w / 2, 280);
    ctx.font = 'bold 55px Rubik, Arial, sans-serif';
    ctx.fillStyle = '#EF476F';
    ctx.fillText(getModeName() + ' РЕЖИМ', w / 2, 400);

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold 90px Rubik, Arial, sans-serif';
    ctx.fillText('🏗️ БАШНЯ', w / 2, h - 220);
    ctx.fillText('МЕГА-ХАЙПА', w / 2, h - 110);

    return canvas.toDataURL('image/png');
}

$('share-btn').addEventListener('click', (e) => { e.stopPropagation(); captureNext = true; });
$('share-close').addEventListener('click', () => shareModal.style.display = 'none');
$('share-download').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `tower-score-${score}.png`;
    link.href = shareImg.src;
    link.click();
});
shareModal.addEventListener('click', (e) => { if (e.target === shareModal) shareModal.style.display = 'none'; });

// ============ CLEANUP & STATE ============
function clearScene() {
    blocks.forEach(b => { scene.remove(b); disposeMesh(b); });
    debris.forEach(d => { scene.remove(d); disposeMesh(d); });
    confetti.forEach(c => { scene.remove(c); disposeMesh(c); });
    blocks = []; debris = []; confetti = [];
    currentBlock = null;
}

function startGame() {
    initAudio();
    stopMusic();
    clearScene();

    score = 0; combo = 0; maxComboThisGame = 0;
    scoreEl.innerText = score;
    direction = 1; currentSpeed = BASE_SPEED; musicTempo = 110;
    gameState = 'playing';
    currentBiomeIndex = 0;
    targetBgColor.set(BIOMES[0].bg);
    scene.background.set(BIOMES[0].bg);
    document.body.style.background = BIOMES[0].bg;

    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }
    if (gameMode === 'time') {
        timeLeft = 60;
        timerEl.style.display = 'block';
        updateTimerDisplay();
        timeAttackTimer = setInterval(() => {
            if (gameState !== 'playing') return;
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timeAttackTimer);
                timeAttackTimer = null;
                triggerGameOver();
            }
        }, 1000);
    } else {
        timerEl.style.display = 'none';
    }

    modeLabel.innerText = getModeName();
    startScreen.style.display = 'none';
    gameOverEl.style.display = 'none';

    camera.position.set(20, 25, 20);
    camera.lookAt(0, 0, 0);

    if (showTutorialHint) tutorialEl.style.display = 'block';

    createBaseBlock();
    startMusic();
    updateQuest('games', 1);
}

function goToMenu() {
    stopMusic();
    clearScene();
    gameState = 'menu';
    
    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }
    
    gameOverEl.style.display = 'none';
    startScreen.style.display = 'flex';
    
    scene.background.set(BIOMES[0].bg);
    document.body.style.background = BIOMES[0].bg;
    camera.position.set(20, 25, 20);
    camera.lookAt(0, 0, 0);
}

function triggerGameOver() {
    if (gameState === 'gameover') return;
    gameState = 'gameover';
    playSound('gameover');
    stopMusic();
    shakeIntensity = 0.8;

    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }

    finalScoreVal.innerText = score;
    const isNew = score > highScore;
    if (isNew) {
        highScore = score;
        localStorage.setItem('towerHighScore', highScore);
        highScoreEl.innerText = `РЕКОРД: ${highScore}`;
    }
    newRecordEl.style.display = isNew ? 'block' : 'none';

    if (score > 0) saveScore(score);
    renderLeaderboard();

    setTimeout(() => { gameOverEl.style.display = 'block'; }, 800);
    
    // Нативная вибрация Telegram при проигрыше
    triggerHaptic('error');
}

// ============ INPUT ============
function handleInput(e) {
    if (e.type === 'touchstart') e.preventDefault();
    if (gameState === 'playing') dropBlock();
}
window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', handleInput, { passive: false });

document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        gameMode = btn.dataset.mode;
        startGame();
    });
});

$('restart-btn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
$('menu-btn').addEventListener('click', (e) => { e.stopPropagation(); goToMenu(); });

function onResize() {
    const aspect = window.innerWidth / window.innerHeight;
    const d = 10;
    camera.left = -d * aspect; camera.right = d * aspect;
    camera.top = d; camera.bottom = -d;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============ INIT ============
initThree();
loadQuests();
renderLeaderboard();
animate();
</script>
