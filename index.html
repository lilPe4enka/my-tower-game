<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Tower Stacker: MEGA HYPE</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #FDE2E4; --text: #5D576B; --accent: #FF9F1C; 
            --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: var(--bg); font-family: 'Rubik', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; transition: background 1s ease;
            padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
        }
        canvas { display: block; }
        button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }

        /* UI Layer */
        #ui-layer {
            position: absolute; inset: 0; pointer-events: none; display: flex;
            flex-direction: column; align-items: center;
            padding: max(60px, calc(var(--safe-top) + 50px)) 0 20px 0; z-index: 10;
        }
        #score-container {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(12px);
            padding: 6px 30px; border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.8);
        }
        #score { color: var(--text); font-size: 64px; font-weight: 900; line-height: 1; transition: transform 0.1s, color 0.2s; }
        #high-score { color: #8A84A0; font-size: 13px; font-weight: 700; margin-top: 2px; letter-spacing: 1px; }
        #timer { color: #EF476F; font-size: 24px; font-weight: 900; display: none; margin-top: 2px; }
        #mode-label { color: #8A84A0; font-size: 10px; font-weight: 700; letter-spacing: 2px; margin-top: 2px; text-transform: uppercase; }
        .score-pop { transform: scale(1.18); color: var(--accent) !important; }

        /* Quests */
        #quests { position: absolute; top: max(70px, calc(var(--safe-top) + 60px)); left: 12px; display: flex; flex-direction: column; gap: 6px; max-width: 170px; }
        .quest-chip { background: rgba(255,255,255,0.75); backdrop-filter: blur(8px); padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.8); white-space: nowrap; }
        .quest-chip.done { background: rgba(6,214,160,0.95); color: white; }

        /* Top Right Controls */
        #top-right-controls { position: absolute; top: max(70px, calc(var(--safe-top) + 60px)); right: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; z-index: 12; }
        #top-right-controls button { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.75); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.8); font-size: 20px; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.2s; }
        #top-right-controls button:active { transform: scale(0.92); background: rgba(255,255,255,0.95); }
        #menu-toggle-btn, #pause-btn { display: none; }
        body.in-game #menu-toggle-btn, body.in-game #pause-btn { display: flex; }

        /* Next Block Indicator */
        #next-block-ui {
            position: absolute; bottom: 20px; left: 20px; pointer-events: none;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
            padding: 10px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10; transition: opacity 0.3s;
        }
        #next-block-ui .label { font-size: 10px; color: #8A84A0; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        #next-block-emoji { font-size: 32px; line-height: 1; }

        /* Fury Mode Overlay */
        #fury-overlay {
            position: absolute; inset: 0; pointer-events: none;
            box-shadow: inset 0 0 50px rgba(255, 0, 100, 0.5); opacity: 0; transition: opacity 0.5s; z-index: 5;
        }
        .fury-active #fury-overlay { opacity: 1; animation: furyPulse 1s infinite alternate; }
        @keyframes furyPulse { from { box-shadow: inset 0 0 30px rgba(255, 0, 100, 0.4); } to { box-shadow: inset 0 0 80px rgba(255, 0, 100, 0.8); } }

        /* Flash Effect */
        #screen-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.1s; }

        /* Popups */
        .popup-text { position: absolute; font-weight: 900; text-align: center; opacity: 0; pointer-events: none; text-transform: uppercase; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 4px 15px rgba(0,0,0,0.2); left: 50%; transform: translateX(-50%) translateY(20px) scale(0.8); width: 100%; z-index: 15; }
        #perfect-text { color: #06D6A0; font-size: 38px; top: 25%; }
        #combo-text { color: #EF476F; font-size: 55px; top: 12%; }
        #milestone-text { color: #118AB2; font-size: 45px; top: 35%; }
        #bonus-text { color: #FF9F1C; font-size: 32px; top: 40%; }
        .show-popup { opacity: 1 !important; transform: translateX(-50%) translateY(0) scale(1.1) !important; }

        /* Screens & Modals */
        .screen { position: absolute; inset: 0; z-index: 100; pointer-events: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; color: var(--text); }
        #start-screen { background: linear-gradient(135deg, #FDE2E4 0%, #E2ECE9 100%); }
        .modal { inset: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; background: rgba(255,255,255,0.98); padding: 25px 30px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); backdrop-filter: blur(20px); border: 2px solid white; width: 90%; max-width: 380px; max-height: 90vh; overflow-y: auto; z-index: 110; }
        
        #start-screen h1 { font-size: 40px; margin: 0 0 8px 0; font-weight: 900; line-height: 1.1;}
        #start-screen p { font-size: 16px; color: #8A84A0; margin: 0 0 20px 0; }
        
        .mode-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
        .mode-btn { background: white; color: var(--text); border: 2px solid transparent; padding: 12px 20px; border-radius: 20px; font-family: 'Rubik', sans-serif; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); transition: all 0.2s; }
        .mode-btn:active { transform: scale(0.98); }
        .mode-btn .mode-icon { font-size: 30px; }
        .mode-btn .mode-info { text-align: left; }
        .mode-btn .mode-name { font-size: 17px; font-weight: 900; display: block; }
        .mode-btn .mode-desc { font-size: 11px; color: #8A84A0; }

        .menu-footer { display: flex; gap: 10px; margin-top: 15px; width: 100%; max-width: 300px; }
        .menu-footer button { flex: 1; background: white; border: none; padding: 12px; border-radius: 15px; font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        #shop-btn { background: #FFD740 !important; color: #5D576B; }

        /* Game Over & Pause */
        #game-over h1, #pause-screen h1 { margin: 0 0 6px 0; font-size: 26px; color: #EF476F; font-weight: 900;}
        #game-over p, #pause-screen p { margin: 0; font-size: 15px; color: #8A84A0; }
        .final-score { font-size: 60px; color: var(--text); font-weight: 900; margin: 6px 0; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-row { display: flex; gap: 10px; }
        .btn-group button { flex: 1; border: none; padding: 14px 16px; font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 14px; border-radius: 15px; transition: all 0.2s; }
        #restart-btn, #pause-resume { background: #06D6A0; color: white; box-shadow: 0 6px 15px rgba(6,214,160,0.3); }
        #menu-btn, #pause-menu { background: #8A84A0; color: white; box-shadow: 0 6px 15px rgba(138,132,160,0.3); }
        #challenge-btn { background: #0088cc; color: white; box-shadow: 0 6px 15px rgba(0,136,204,0.3); }

        /* Shop */
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .shop-header h2 { margin: 0; font-size: 22px; font-weight: 900; }
        .coins-balance { background: #FFF3E0; color: #F57C00; padding: 5px 12px; border-radius: 12px; font-weight: 900; font-size: 16px; }
        .skin-list { display: flex; flex-direction: column; gap: 10px; }
        .skin-item { display: flex; align-items: center; justify-content: space-between; background: #F5F5F5; padding: 10px 15px; border-radius: 15px; }
        .skin-item .skin-info { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
        .skin-item button { padding: 8px 15px; border-radius: 10px; border: none; font-weight: 900; font-family: 'Rubik', sans-serif; font-size: 13px; }
        .skin-item button.buy { background: #06D6A0; color: white; }
        .skin-item button.equip { background: #FF9F1C; color: white; }
        .skin-item button.equipped { background: #CBF3F0; color: #2EC4B6; }

        #tutorial { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); background: rgba(93,87,107,0.95); color: white; padding: 12px 20px; border-radius: 16px; font-weight: 700; font-size: 14px; text-align: center; display: none; z-index: 15; pointer-events: none; animation: bounce 1.5s infinite; width: max-content; max-width: 90%; }
        @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-8px); } }
    </style>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>

<script type="module">
import * as THREE from 'three';

// ==========================================
// TELEGRAM INIT & HAPTICS
// ==========================================
const tg = window.Telegram?.WebApp;
if (tg) {
    try { tg.ready(); tg.expand(); if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); tg.onEvent('viewportChanged', () => { if (typeof onResize === 'function') onResize(); }); } catch (err) {}
}
function triggerHaptic(type = 'light') {
    try {
        if (tg?.HapticFeedback) {
            if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
            else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
            else tg.HapticFeedback.impactOccurred(type);
        } else if (navigator.vibrate) { if (type === 'error') navigator.vibrate([100, 50, 100]); else navigator.vibrate(50); }
    } catch (err) {}
}
function safeClick(el, handler) {
    if (!el) return;
    let lastFire = 0;
    const wrapped = (e) => { const now = Date.now(); if (now - lastFire < 300) return; lastFire = now; if (e.cancelable !== false) e.stopPropagation(); handler(e); };
    el.addEventListener('click', wrapped); el.addEventListener('touchend', wrapped, { passive: true });
}

// ==========================================
// НАСТРОЙКИ И КОНТЕНТ
// ==========================================
const BLOCK_SIZE = 4, BLOCK_HEIGHT = 1;
const BASE_SPEED = 0.16, MAX_SPEED = 0.45;

const BASE_COLORS = ['#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE', '#448AFF', '#18FFFF', '#64FFDA', '#69F0AE', '#FFD740', '#FFAB40', '#FF6E40'];
const BASE_EMOJIS = ['🥟', '🥛', '🌭', '💩', '🤡', '👽', '😭', '🍕', '🍔', '🍩', '🔥', '🥴', '🐷', '🎉', '🦄', '🍦', '🧠', '💀', '🤮', '👻', '🦍', '🍆', '💸'];
const BASE_TEXTS = ['БОРЩ', 'КЕФИР', 'ПЕЛЬМЕНИ', 'СОСИС', 'КРИНЖ', 'ЖИЗА', 'ПОХУДЕТЬ', 'ТУПЕЕ', 'БАТЯ', 'МАТЬ', 'ХАЙП', 'СКУФ', 'ИПОТЕКА', 'ЗАРПЛАТА', 'ДЕДЛАЙН', 'СПАТЬ', 'ПИВО', 'ДРАТУТИ', 'АЛЛО', 'ПРИВЕТ'];

const CAT_EMOJIS = ['🐱', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾'];
const SPACE_EMOJIS = ['🌍', '🌕', '🚀', '👾', '🛸', '⭐', '🪐', '🌌', '☄️', '👨‍🚀'];
const RETRO_EMOJIS = ['👾', '🕹️', '💾', '📼', '📟', '📺', '🎮', '🖥️', '💿', '🎧'];

const SKINS = {
    default: { name: 'Классика', emojis: BASE_EMOJIS, colors: BASE_COLORS, texts: BASE_TEXTS, price: 0 },
    cats: { name: 'Котики', emojis: CAT_EMOJIS, colors: ['#FFCDD2', '#F8BBD0', '#E1BEE7', '#D1C4E9', '#C5CAE9', '#BBDEFB'], texts: ['МЯУ', 'МУР', 'КОТИК', 'ЛАПКИ', 'ХВОСТ', 'УСЫ', 'КОРМ', 'РЫБА', 'СОН', 'МЯСО'], price: 100 },
    space: { name: 'Космос', emojis: SPACE_EMOJIS, colors: ['#311B92', '#4527A0', '#512DA8', '#1A237E', '#283593', '#0D47A1'], texts: ['МАРС', 'ЛУНА', 'САТУРН', 'НЛО', 'ЗВЕЗДА', 'КОСМОС', 'ОРБИТА', 'ГРАВИТАЦИЯ', 'ВАКУУМ', 'СКАФАНДР'], price: 250 },
    retro: { name: 'Ретро 8-бит', emojis: RETRO_EMOJIS, colors: ['#00E676', '#00B248', '#009624', '#69F0AE', '#B9F6CA', '#D500F9'], texts: ['PIXEL', 'GAME', 'RETRO', '8-BIT', 'ATARI', 'NINTENDO', 'SEGA', 'TETRIS', 'JOYSTICK', 'CRT'], price: 500 }
};

let scene, camera, renderer, musicGain, windGain, windOsc;
let blocks = [], debris = [], confetti = [];
let currentBlock, nextBlockData, direction = 1;
let score = 0, combo = 0, coins = parseInt(localStorage.getItem('towerCoins')) || 0;
let highScore = parseInt(localStorage.getItem('towerHighScore')) || 0;
let currentSkin = localStorage.getItem('towerSkin') || 'default';
let unlockedSkins = JSON.parse(localStorage.getItem('towerSkins') || '["default"]');

let gameState = 'menu', gameMode = 'classic';
let movingAxis = 'x', currentSpeed = BASE_SPEED;
let currentBiomeIndex = 0, targetBgColor = new THREE.Color('#FDE2E4'), shakeIntensity = 0;
let timeLeft = 60, timeAttackTimer = null;
let showTutorialHint = !localStorage.getItem('towerTutorialShown');
let isMuted = localStorage.getItem('towerMuted') === 'true';
let clock = new THREE.Clock();
let newQuestsTimeout = null, quests = [];
let isFury = false, furyBlocksLeft = 0;

const QUESTS_POOL = [
    { type: 'perfect', target: 5,  text: '🎯 Точность x5', reward: 20 },
    { type: 'perfect', target: 10, text: '🎯 Точность x10', reward: 40 },
    { type: 'stack', target: 15, text: '🏗️ Высота 15', reward: 30 },
    { type: 'stack', target: 25, text: '🏗️ Высота 25', reward: 50 },
    { type: 'combo', target: 3, text: '🔥 Комбо x3', reward: 20 },
    { type: 'combo', target: 5, text: '🔥 Комбо x5', reward: 40 },
    { type: 'cut', target: 10, text: '✂️ 10 срезов', reward: 20 },
    { type: 'games', target: 3, text: '🎮 3 игры', reward: 15 },
];

// ==========================================
// UI ELEMENTS
// ==========================================
const $ = id => document.getElementById(id);
const scoreEl = $('score'), highScoreEl = $('high-score');
const gameOverEl = $('game-over'), pauseScreen = $('pause-screen'), shopScreen = $('shop-screen'), startScreen = $('start-screen');
const perfectText = $('perfect-text'), comboText = $('combo-text'), milestoneText = $('milestone-text'), bonusText = $('bonus-text');
const finalScoreVal = $('final-score-val'), timerEl = $('timer'), modeLabel = $('mode-label');
const questsEl = $('quests'), muteBtn = $('mute-btn'), pauseBtn = $('pause-btn'), menuToggleBtn = $('menu-toggle-btn');
const tutorialEl = $('tutorial'), nextBlockEmoji = $('next-block-emoji');
const screenFlash = $('screen-flash'), coinsBalanceEl = $('coins-balance'), skinListEl = $('skin-list');
highScoreEl.innerText = `РЕКОРД: ${highScore}`;
coinsBalanceEl.innerText = `🪙 ${coins}`;

// ==========================================
// AUDIO ENGINE
// ==========================================
let audioCtx = null, noiseBuffer = null;
let musicPlaying = false, musicBeat = 0, musicTempo = 110, musicTimeout = null;

function initAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const size = audioCtx.sampleRate * 1.0; // 1 sec for wind
            noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
            
            musicGain = audioCtx.createGain(); musicGain.gain.value = 0.12; musicGain.connect(audioCtx.destination);
            windGain = audioCtx.createGain(); windGain.gain.value = 0; windGain.connect(audioCtx.destination);
            windOsc = audioCtx.createBufferSource(); windOsc.buffer = noiseBuffer; windOsc.loop = true;
            const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 400;
            windOsc.connect(windFilter); windFilter.connect(windGain); windOsc.start();
        } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type, level = 0) {
    if (isMuted || !audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime; const master = audioCtx.createGain(); master.connect(audioCtx.destination);
    const tone = (freq, endFreq, wave, dur, vol, delay = 0) => {
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
        osc.type = wave; osc.frequency.setValueAtTime(freq, now + delay);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + delay + dur);
        filter.type = 'lowpass'; filter.frequency.value = 2000;

    const noise = (dur, vol, delay = 0) => {
        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer; const filter = audioCtx.createBiquadFilter(); const g = audioCtx.createGain();
        filter.type = 'bandpass'; filter.frequency.value = 1000;
        g.gain.setValueAtTime(vol, now + delay); g.gain.exponentialRampToValueAtTime(0.01, now + delay + dur);
        src.connect(filter); filter.connect(g); g.connect(master); src.start(now + delay);
    };
    if (type === 'drop') { tone(90, 40, 'sine', 0.15, 0.35); noise(0.08, 0.1); }
    else if (type === 'perfect') { const mult = Math.pow(1.059, Math.min(level, 12)); tone(523.25 * mult, null, 'sine', 0.4, 0.25); tone(659.25 * mult, null, 'sine', 0.4, 0.18); }
    else if (type === 'milestone') { [261.63, 329.63, 392.00, 523.25].forEach((f, i) => tone(f, null, 'triangle', 0.5, 0.12, i * 0.1)); }
    else if (type === 'bomb') { noise(0.4, 0.4); tone(120, 30, 'sawtooth', 0.4, 0.3); }
    else if (type === 'gameover') { tone(200, 80, 'triangle', 0.8, 0.25); tone(150, 60, 'triangle', 0.8, 0.18, 0.1); }
    else if (type === 'quest') { tone(659.25, null, 'sine', 0.2, 0.2); tone(783.99, null, 'sine', 0.3, 0.2, 0.1); tone(1046.5, null, 'sine', 0.4, 0.2, 0.2); }
    else if (type === 'fury') { tone(440, 880, 'sawtooth', 0.5, 0.15); tone(554, 1108, 'sawtooth', 0.5, 0.1); }
}

function playKick() { if (!audioCtx) return; const osc = audioCtx.createOscillator(), g = audioCtx.createGain(); osc.frequency.setValueAtTime(140, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12); g.gain.setValueAtTime(0.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12); osc.connect(g); g.connect(musicGain); osc.start(); osc.stop(audioCtx.currentTime + 0.12); }

function musicTick() {
    if (!musicPlaying || isMuted) return;
    const beat = musicBeat % 8;
    if (beat === 0 || beat === 3 || beat === 4) playKick();
    if (beat === 2 || beat === 6) playHat();
    if (beat === 0 || beat === 4) playBass();
    musicBeat++;
    musicTimeout = setTimeout(musicTick, (60000 / musicTempo) / 2);
}
function startMusic() { if (musicPlaying || isMuted) return; initAudio(); if (!audioCtx) return; musicPlaying = true; musicBeat = 0; musicTempo = 110; musicTick(); }
function stopMusic() { musicPlaying = false; if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; } }

// ==========================================
function generateNewQuests() {
    const pool = [...QUESTS_POOL]; quests = [];
    for (let i = 0; i < 3; i++) {
        const idx = Math.floor(Math.random() * pool.length);
        const q = pool.splice(idx, 1)[0];
        quests.push({ ...q, current: 0, done: false });
    }
    saveQuests(); renderQuests();
}
function loadQuests() {
    const today = new Date().toDateString();
    const saved = JSON.parse(localStorage.getItem('towerQuests') || 'null');
    if (saved && saved.date === today && saved.quests?.length === 3) { quests = saved.quests; renderQuests(); }
    else { generateNewQuests(); }
}
function saveQuests() { localStorage.setItem('towerQuests', JSON.stringify({ date: new Date().toDateString(), quests })); }
function updateQuest(type, value, isMax = false) {
    let changed = false;
    quests.forEach(q => {
        if (q.type !== type || q.done) return;
        if (isMax) { if (value > q.current) { q.current = Math.min(q.target, value); changed = true; } }
        else { q.current = Math.min(q.target, q.current + value); changed = true; }
        if (q.current >= q.target && !q.done) {
            q.done = true; coins += q.reward; localStorage.setItem('towerCoins', coins);
            playSound('quest'); showPopup(bonusText, `🎁 +${q.reward} 🪙`, 1200); triggerHaptic('success');
            updateCoinUI();
        }
    });
    if (changed) { saveQuests(); renderQuests(); }
    if (quests.every(q => q.done) && !newQuestsTimeout) {
        newQuestsTimeout = setTimeout(() => {
            newQuestsTimeout = null; generateNewQuests();
            showPopup(bonusText, '🌟 НОВЫЕ КВЕСТЫ!', 1500); playSound('quest'); triggerHaptic('success');
        }, 1500);
    }
}
function renderQuests() {
    questsEl.innerHTML = '';
    quests.forEach(q => {
        const chip = document.createElement('div');
        chip.className = 'quest-chip' + (q.done ? ' done' : '');
        chip.textContent = q.done ? '✅ ' + q.text : `${q.text} ${q.current}/${q.target}`;
        questsEl.appendChild(chip);
    });
}
function updateCoinUI() { coinsBalanceEl.innerText = `🪙 ${coins}`; }

function renderShop() {
    skinListEl.innerHTML = '';
    for (const [key, skin] of Object.entries(SKINS)) {
        const isUnlocked = unlockedSkins.includes(key);
        const isEquipped = currentSkin === key;
        const div = document.createElement('div'); div.className = 'skin-item';
        
        let btnHtml = '';
        if (isEquipped) btnHtml = `<button class="equipped">НАДЕТО</button>`;
        else if (isUnlocked) btnHtml = `<button class="equip" data-skin="${key}">НАДЕТЬ</button>`;
        else btnHtml = `<button class="buy" data-skin="${key}" data-price="${skin.price}">КУПИТЬ (${skin.price} 🪙)</button>`;

        div.innerHTML = `<div class="skin-info"><span>${skin.emojis[0]}</span> ${skin.name}</div> ${btnHtml}`;
        skinListEl.appendChild(div);
    }

    // Обработчики
    skinListEl.querySelectorAll('button.equip').forEach(btn => {
        safeClick(btn, () => {
            currentSkin = btn.dataset.skin;
            localStorage.setItem('towerSkin', currentSkin);
            renderShop();
        });
    });
    skinListEl.querySelectorAll('button.buy').forEach(btn => {
        safeClick(btn, () => {
            const price = parseInt(btn.dataset.price);
            if (coins >= price) {
                coins -= price; localStorage.setItem('towerCoins', coins);
                const skin = btn.dataset.skin;
                unlockedSkins.push(skin); localStorage.setItem('towerSkins', JSON.stringify(unlockedSkins));
                currentSkin = skin; localStorage.setItem('towerSkin', currentSkin);
                updateCoinUI(); renderShop();
                triggerHaptic('success');
            } else {
                triggerHaptic('error');
                btn.innerText = 'НЕ ХВАТАЕТ 🪙';
                setTimeout(() => renderShop(), 1500);
            }
        });
    });
}

function disposeMesh(mesh) {
    if (!mesh) return;
    if (mesh.geometry) mesh.geometry.dispose();
    if (Array.isArray(mesh.material)) mesh.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    else if (mesh.material) { if (mesh.material.map) mesh.material.map.dispose(); mesh.material.dispose(); }
}

function createTexture(emoji, text, color, type = 'normal') {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const ctx = c.getContext('2d');
    
    if (type === 'golden') {
        const grad = ctx.createLinearGradient(0, 0, 512, 512); grad.addColorStop(0, '#FFD700'); grad.addColorStop(0.5, '#FFF8DC'); grad.addColorStop(1, '#B8860B');
        ctx.fillStyle = grad; ctx.fillRect(0,0,512,512); ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 25; ctx.strokeRect(12.5, 12.5, 487, 487);
    } else if (type === 'bomb') {
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,512,512); ctx.save(); ctx.beginPath(); ctx.rect(0,0,512,512); ctx.clip();
        ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 60; for(let i=-512; i<1024; i+=120) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+512,512); ctx.stroke(); }
        ctx.restore(); ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 25; ctx.strokeRect(12.5,12.5,487,487);
    } else if (type === 'ice') {
        ctx.fillStyle = '#00E5FF'; ctx.fillRect(0,0,512,512); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 8;
        for(let i=0; i<8; i++) { ctx.beginPath(); ctx.moveTo(Math.random()*512, 0); ctx.lineTo(Math.random()*512, 512); ctx.stroke(); }
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 25; ctx.strokeRect(12.5,12.5,487,487);
    } else if (type === 'crumble') {
        ctx.fillStyle = '#795548'; ctx.fillRect(0,0,512,512); ctx.strokeStyle = '#3E2723'; ctx.lineWidth = 15;
        for(let i=0; i<10; i++) { ctx.beginPath(); ctx.moveTo(Math.random()*512, Math.random()*512); ctx.lineTo(Math.random()*512, Math.random()*512); ctx.stroke(); }
        ctx.strokeStyle = '#5D4037'; ctx.lineWidth = 25; ctx.strokeRect(12.5,12.5,487,487);
    } else {
        ctx.fillStyle = color; ctx.fillRect(0,0,512,512); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 20; ctx.strokeRect(10,10,492,492);
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(256, 220, 150, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
    ctx.font = '220px Arial'; ctx.fillText(emoji, 256, 210);
    
    ctx.fillStyle = type === 'golden' ? '#5C4033' : '#ffffff'; ctx.font = '900 72px "Rubik", sans-serif';
    ctx.lineWidth = 10; ctx.strokeStyle = type === 'golden' ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.2)';
    ctx.strokeText(text, 256, 430); ctx.fillText(text, 256, 430);
    
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false; 
    return tex;
}

function createBlockMesh(w, h, d, color, emoji, text, type = 'normal') {
    const geo = new THREE.BoxGeometry(w, h, d); const tex = createTexture(emoji, text, color, type);
    let sideOpts = { map: tex, roughness: 0.7 }; let topOpts = { color: color, roughness: 0.8 };

    if (type === 'golden') { sideOpts.emissive = new THREE.Color(0xFFAA00); sideOpts.emissiveIntensity = 0.4; topOpts.emissive = new THREE.Color(0xFFAA00); topOpts.emissiveIntensity = 0.4; topOpts.color = new THREE.Color(0xFFD700); }
    else if (type === 'bomb') { sideOpts.emissive = new THREE.Color(0x550000); sideOpts.emissiveIntensity = 0.5; topOpts.emissive = new THREE.Color(0x550000); topOpts.emissiveIntensity = 0.5; topOpts.color = new THREE.Color(0x222222); }
    else if (type === 'ice') { sideOpts.transparent = true; sideOpts.opacity = 0.85; topOpts.transparent = true; topOpts.opacity = 0.85; sideOpts.emissive = new THREE.Color(0x00FFFF); sideOpts.emissiveIntensity = 0.2; topOpts.emissive = new THREE.Color(0x00FFFF); topOpts.emissiveIntensity = 0.2; }
    else if (type === 'crumble') { sideOpts.emissive = new THREE.Color(0x3E2723); sideOpts.emissiveIntensity = 0.3; topOpts.emissive = new THREE.Color(0x3E2723); topOpts.emissiveIntensity = 0.3; }

    const side = new THREE.MeshStandardMaterial(sideOpts); const top = new THREE.MeshStandardMaterial(topOpts);
    const mesh = new THREE.Mesh(geo, [side, side, top, top, side, side]);
    mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.blockType = type;
    return mesh;
}

function rollBlockType() {
    if (score < 5) return 'normal';
    const r = Math.random();
    if (r < 0.06) return 'golden';
    if (r < 0.12) return 'bomb';
    if (r < 0.18) return 'ice';
    if (r < 0.22 && score > 15) return 'crumble';
    return 'normal';
}

function getBlockVisuals(type, skinKey) {
    const skin = SKINS[skinKey];
    const rndColor = skin.colors[Math.floor(Math.random() * skin.colors.length)];
    const rndEmoji = skin.emojis[Math.floor(Math.random() * skin.emojis.length)];
    const rndText = skin.texts[Math.floor(Math.random() * skin.texts.length)];
    
    switch(type) {
        case 'golden': return { color: '#FFD700', emoji: '👑', text: 'ЗОЛОТО' };
        case 'bomb': return { color: '#2C3E50', emoji: '💣', text: 'БУМ' };
        case 'ice': return { color: '#00E5FF', emoji: '❄️', text: 'ЛЕД' };
        case 'crumble': return { color: '#795548', emoji: '🧱', text: 'ХРУПКИЙ' };
        default: return { color: rndColor, emoji: rndEmoji, text: rndText };
    }
}

function generateNextBlockData() {
    const type = rollBlockType();
    const { color, emoji, text } = getBlockVisuals(type, currentSkin);
    return { type, color, emoji, text };
}

function createBaseBlock() {
    nextBlockData = generateNextBlockData();
    const base = createBlockMesh(BLOCK_SIZE, BLOCK_HEIGHT, BLOCK_SIZE, '#FF5252', '🏗️', 'БАЗА', 'normal');
    base.position.set(0, 0, 0); scene.add(base); blocks.push(base);
    spawnNewBlock();
}

function spawnNewBlock() {
    const top = blocks[blocks.length - 1];
    // Движение по диагонали после 30 очков
    if (score > 30) movingAxis = 'diag';
    else movingAxis = blocks.length % 2 === 1 ? 'x' : 'z';

    const { type, color, emoji, text } = nextBlockData;
    nextBlockData = generateNextBlockData();
    nextBlockEmoji.innerText = nextBlockData.emoji;

    const w = top.geometry.parameters.width, d = top.geometry.parameters.depth;
    let sx = top.position.x, sz = top.position.z;
    if (movingAxis === 'x') sx = direction === 1 ? -15 : 15;
    else if (movingAxis === 'z') sz = direction === 1 ? -15 : 15;
    else if (movingAxis === 'diag') { sx = direction === 1 ? -15 : 15; sz = direction === 1 ? -15 : 15; }

    currentBlock = createBlockMesh(w, BLOCK_HEIGHT, d, color, emoji, text, type);
    currentBlock.position.set(sx, top.position.y + BLOCK_HEIGHT, sz);
    currentBlock.userData = { w, d, moving: true, color, emoji, text, blockType: type, squash: 1 };
    scene.add(currentBlock);
}

// ==========================================
// GAME LOGIC
// ==========================================
function showPopup(el, text, duration = 800) { if (!el) return; if (text) el.innerText = text; el.classList.add('show-popup'); setTimeout(() => el.classList.remove('show-popup'), duration); }

function flashScreen() {
    screenFlash.style.opacity = '0.6';
    setTimeout(() => screenFlash.style.opacity = '0', 100);
}

function dropBlock() {
    if (gameState !== 'playing' || !currentBlock?.userData.moving) return;
    if (showTutorialHint) { tutorialEl.style.display = 'none'; localStorage.setItem('towerTutorialShown', 'true'); showTutorialHint = false; }

    currentBlock.userData.moving = false;
    const top = blocks[blocks.length - 1];
    
    let diffX = 0, diffZ = 0, sizeX = currentBlock.geometry.parameters.width, sizeZ = currentBlock.geometry.parameters.depth;

    if (movingAxis === 'x') diffX = currentBlock.position.x - top.position.x;
    else if (movingAxis === 'z') diffZ = currentBlock.position.z - top.position.z;
    else if (movingAxis === 'diag') { diffX = currentBlock.position.x - top.position.x; diffZ = currentBlock.position.z - top.position.z; }

    const absDiffX = Math.abs(diffX), absDiffZ = Math.abs(diffZ);
    const maxDiff = Math.max(absDiffX, absDiffZ);
    
    // Проверка на проигрыш
    if ((movingAxis === 'x' || movingAxis === 'diag') && absDiffX >= sizeX / 2) { currentBlock.userData.falling = true; triggerGameOver(); return; }
    if ((movingAxis === 'z' || movingAxis === 'diag') && absDiffZ >= sizeZ / 2) { currentBlock.userData.falling = true; triggerGameOver(); return; }

    // Логика разрушающегося блока (Хрупкий)
    if (currentBlock.userData.blockType === 'crumble' && maxDiff < 0.15) {
        currentBlock.position.x = top.position.x; currentBlock.position.z = top.position.z;
        spawnBombParticles(); // Используем взрывные партиклы
        triggerGameOver(); // Игра окончена, т.к. блок разрушился
        return;
    }

    // PERFECT
    if (maxDiff < 0.15) {
        currentBlock.position.x = top.position.x; currentBlock.position.z = top.position.z;
        combo++;

        let points = 1;
        if (currentBlock.userData.blockType === 'golden') points = 3;
        else if (currentBlock.userData.blockType === 'bomb') points = 2;
        else if (currentBlock.userData.blockType === 'ice') points = 2;

        if (currentBlock.userData.blockType === 'bomb') { playSound('bomb'); showPopup(bonusText, '💥 БУМ! +2', 1000); shakeIntensity = 0.5; updateQuest('bomb', 1); }
        else { playSound('perfect', combo); if (currentBlock.userData.blockType === 'golden') { showPopup(bonusText, '👑 ЗОЛОТО +3', 900); updateQuest('golden', 1); } else if (currentBlock.userData.blockType === 'ice') { showPopup(bonusText, '❄️ ЛЕД +2', 900); updateQuest('ice', 1); } else showPopup(perfectText, null, 600); }

        flashScreen(); // Эффект вспышки
        if (gameMode === 'time') { timeLeft += 2; updateTimerDisplay(); }
        
        // Активация Режима Ярости
        if (combo >= 5 && !isFury) {
            isFury = true; furyBlocksLeft = 3;
            document.body.classList.add('fury-active');
            playSound('fury'); showPopup(milestoneText, '🔥 ЯРОСТЬ! x2 ОЧКИ', 2000);
        }

        if (combo > 1 && !isFury) showPopup(comboText, `КОМБО x${combo}`, 800);

        if (isFury) points *= 2;

        updateQuest('perfect', 1); updateQuest('combo', combo, true); triggerHaptic('light');

        const oldScore = score; score += points;
        checkMilestone(oldScore, score);
        triggerPerfectParticles();
    } else {
        // CUT
        combo = 0;
        updateQuest('cut', 1);
        if (currentBlock.userData.blockType === 'bomb') { score = Math.max(0, score - 1); playSound('bomb'); shakeIntensity = 0.5; showPopup(bonusText, '💣 -1 ОЧКО', 900); spawnBombParticles(); triggerHaptic('error'); }
        else { playSound('drop'); triggerHaptic('light'); }

        // Урезаем блок (для диагонали урезаем по одной оси, где больше разница)
        let cutAxis = movingAxis === 'diag' ? (absDiffX > absDiffZ ? 'x' : 'z') : movingAxis;
        let cutDiff = cutAxis === 'x' ? diffX : diffZ;
        let origSize = cutAxis === 'x' ? sizeX : sizeZ;
        let newSize = origSize - Math.abs(cutDiff);

        createDebris(cutDiff, origSize, newSize, cutAxis, top);

        const w = cutAxis === 'x' ? newSize : currentBlock.userData.w;
        const d = cutAxis === 'z' ? newSize : currentBlock.userData.d;
        scene.remove(currentBlock); disposeMesh(currentBlock);

        const nm = createBlockMesh(w, BLOCK_HEIGHT, d, currentBlock.userData.color, currentBlock.userData.emoji, currentBlock.userData.text, 'normal');
        
        // Позиционирование обрезанного блока
        let targetX = top.position.x, targetZ = top.position.z;
        if (cutAxis === 'x') targetX = top.position.x + (diffX > 0 ? (origSize-newSize)/2 : -(origSize-newSize)/2);
        if (cutAxis === 'z') targetZ = top.position.z + (diffZ > 0 ? (origSize-newSize)/2 : -(origSize-newSize)/2);
        
        nm.position.set(targetX, currentBlock.position.y, targetZ);
        nm.userData = { ...currentBlock.userData, w, d, blockType: 'normal', squash: 1 };
        currentBlock = nm;

        if (currentBlock.userData.blockType !== 'bomb') score++;
    }

    // Squash & Stretch (эффект желе)
    currentBlock.userData.squash = 0; // Начинаем анимацию сжатия

    // Режим ярости - уменьшаем счетчик
    if (isFury) {
        furyBlocksLeft--;
        if (furyBlocksLeft <= 0) { isFury = false; document.body.classList.remove('fury-active'); }
    }

    updateScoreUI();
    currentSpeed = Math.min(MAX_SPEED, BASE_SPEED + score * 0.004);
    musicTempo = Math.min(160, 110 + Math.floor(score / 10) * 5);

    blocks.push(currentBlock); scene.add(currentBlock); spawnNewBlock();
}

function updateScoreUI() { scoreEl.innerText = score; scoreEl.classList.add('score-pop'); setTimeout(() => scoreEl.classList.remove('score-pop'), 150); updateQuest('stack', score, true); }
function checkMilestone(oldScore, newScore) { const oldM = Math.floor(oldScore / 10); const newM = Math.floor(newScore / 10); if (newM > oldM) triggerMilestone(newM * 10); }

// ==========================================
// EFFECTS
// ==========================================
function triggerPerfectParticles() {
    currentBlock.material.forEach(m => { if (m.emissive) { m.emissive.setHex(0x444444); setTimeout(() => m.emissive.setHex(0x000000), 200); } });
    for (let i = 0; i < 12; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0x06D6A0 }));
        p.position.copy(currentBlock.position); p.position.y += 0.5;
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.6, Math.random()*0.6+0.2, (Math.random()-0.5)*0.6), life: 1.0 };
        scene.add(p); debris.push(p);
    }
}

function spawnBombParticles() {
    for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xFF0000 : 0xFFAA00 }));
        p.position.copy(currentBlock.position);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*1.2, Math.random()*0.8+0.3, (Math.random()-0.5)*1.2), life: 1.0 };
        scene.add(p); debris.push(p);
    }
}

function triggerMilestone(points) {
    playSound('milestone'); triggerHaptic('success');
    const newBiome = Math.floor(points / 10) % BIOMES.length; currentBiomeIndex = newBiome;
    targetBgColor.set(BIOMES[newBiome].bg); document.body.style.background = BIOMES[newBiome].bg;
    showPopup(milestoneText, `${points} ЭТАЖЕЙ!`, 1500);

    const topPos = blocks[blocks.length - 1].position;
    for (let i = 0; i < 40; i++) {
        const piece = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.02), new THREE.MeshBasicMaterial({ color: SKINS[currentSkin].colors[Math.floor(Math.random() * SKINS[currentSkin].colors.length)] }));
        piece.position.set(topPos.x + (Math.random()-0.5)*2, topPos.y + 2, topPos.z + (Math.random()-0.5)*2);
        const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 0.3 + 0.1;
        piece.userData = { vel: new THREE.Vector3(Math.cos(angle)*speed, Math.random()*0.6+0.3, Math.sin(angle)*speed), rotSpeed: new THREE.Vector3(Math.random()*0.3, Math.random()*0.3, Math.random()*0.3) };
        scene.add(piece); confetti.push(piece);
    }
}

function createDebris(diff, origSize, newSize, axis, top) {
    const dSize = origSize - newSize;
    const geo = new THREE.BoxGeometry(axis === 'x' ? dSize : currentBlock.userData.w, BLOCK_HEIGHT, axis === 'z' ? dSize : currentBlock.userData.d);
    const mat = new THREE.MeshStandardMaterial({ color: currentBlock.userData.color, roughness: 0.9 });
    const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true;
    let px = currentBlock.position.x, pz = currentBlock.position.z;
    if (axis === 'x') px = diff > 0 ? top.position.x + (origSize/2) + (dSize/2) : top.position.x - (origSize/2) - (dSize/2);
    else pz = diff > 0 ? top.position.z + (origSize/2) + (dSize/2) : top.position.z - (origSize/2) - (dSize/2);
    mesh.position.set(axis === 'x' ? px : currentBlock.position.x, currentBlock.position.y, axis === 'z' ? pz : currentBlock.position.z);
    mesh.userData = { vel: new THREE.Vector3(axis === 'x' ? (diff > 0 ? 0.15 : -0.15) : 0, 0.1, axis === 'z' ? (diff > 0 ? 0.15 : -0.15) : 0), rotSpeed: new THREE.Vector3((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3) };
    scene.add(mesh); debris.push(mesh);
}

// ==========================================
// CAMERA & LOOP
// ==========================================
function updateCamera() {
    if (!blocks.length) return;
    const top = blocks[blocks.length - 1];
    const ty = top.position.y, tx = top.position.x * 0.5, tz = top.position.z * 0.5;
    camera.position.x += (tx + 20 - camera.position.x) * 0.1; camera.position.y += (ty + 25 - camera.position.y) * 0.1; camera.position.z += (tz + 20 - camera.position.z) * 0.1;
    camera.lookAt(tx, ty + 2, tz);
    if (shakeIntensity > 0.01) { camera.position.x += (Math.random()-0.5) * shakeIntensity; camera.position.y += (Math.random()-0.5) * shakeIntensity; camera.position.z += (Math.random()-0.5) * shakeIntensity; shakeIntensity *= 0.85; }
}

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // Управление ветром (громкость зависит от высоты)
    if (audioCtx && windGain && gameState === 'playing') {
        const windVol = Math.min(0.15, score * 0.005);
        windGain.gain.setTargetAtTime(windVol, audioCtx.currentTime, 0.5);
    } else if (windGain) {
        windGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }

    if (gameState === 'playing' && currentBlock?.userData.moving) {
        let speed = currentSpeed;
        if (isFury) speed *= 0.6; // Замедление в ярости
        if (currentBlock.userData.blockType === 'ice') speed = Math.min(speed * 1.8, 0.6);

        let delta = speed * direction;
        if (score > 20 && !isFury) delta += Math.sin(performance.now() * 0.003) * 0.02;

        if (movingAxis === 'x') { currentBlock.position.x += delta; if (currentBlock.position.x > 15) direction = -1; if (currentBlock.position.x < -15) direction = 1; }
        else if (movingAxis === 'z') { currentBlock.position.z += delta; if (currentBlock.position.z > 15) direction = -1; if (currentBlock.position.z < -15) direction = 1; }
        else if (movingAxis === 'diag') {
            currentBlock.position.x += delta; currentBlock.position.z += delta * 0.8;
            if (currentBlock.position.x > 15 || currentBlock.position.z > 15) direction = -1;
            if (currentBlock.position.x < -15 || currentBlock.position.z < -15) direction = 1;
        }

        // Пульсация свечения
        if (currentBlock.userData.blockType === 'golden' || currentBlock.userData.blockType === 'bomb') {
            const pulse = 0.3 + (Math.sin(time * 8) * 0.2);
            currentBlock.material.forEach(m => { if (m.emissive) m.emissiveIntensity = pulse; });
        } else if (currentBlock.userData.blockType === 'ice') {
            const pulse = 0.85 + (Math.sin(time * 4) * 0.1);
            currentBlock.material.forEach(m => { if (m.transparent) m.opacity = pulse; });
        }
    }

    // Squash & Stretch анимация
    blocks.forEach(b => {
        if (b.userData.squash !== undefined && b.userData.squash < 1) {
            b.userData.squash += 0.1; // Скорость возврата
            if (b.userData.squash > 1) b.userData.squash = 1;
            const scaleY = 1 - Math.sin(b.userData.squash * Math.PI) * 0.3;
            const scaleXZ = 1 + Math.sin(b.userData.squash * Math.PI) * 0.15;
            b.scale.set(scaleXZ, scaleY, scaleXZ);
        }
    });

    if (currentBlock?.userData.falling) { currentBlock.position.y -= 0.3; currentBlock.rotation.x += 0.05; currentBlock.rotation.z += 0.05; }

    for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i]; d.position.add(d.userData.vel); d.userData.vel.y -= 0.02;
        if (d.userData.rotSpeed) { d.rotation.x += d.userData.rotSpeed.x; d.rotation.y += d.userData.rotSpeed.y; d.rotation.z += d.userData.rotSpeed.z; }
        if (d.userData.life !== undefined) { d.userData.life -= 0.02; d.scale.setScalar(d.userData.life); if (d.userData.life <= 0) { scene.remove(d); disposeMesh(d); debris.splice(i, 1); continue; } }
        if (d.position.y < camera.position.y - 40) { scene.remove(d); disposeMesh(d); debris.splice(i, 1); }
    }

    for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i]; c.position.add(c.userData.vel); c.userData.vel.y -= 0.015; c.userData.vel.x *= 0.98; c.userData.vel.z *= 0.98;
        c.rotation.x += c.userData.rotSpeed.x; c.rotation.y += c.userData.rotSpeed.y; c.rotation.z += c.userData.rotSpeed.z;
        if (c.position.y < camera.position.y - 40) { scene.remove(c); disposeMesh(c); confetti.splice(i, 1); }
    }

    if (gameState === 'playing' || gameState === 'gameover') updateCamera();
    scene.background.lerp(targetBgColor, 0.05);
    renderer.render(scene, camera);
}

// ==========================================
// STATE MANAGEMENT
// ==========================================
function clearScene() {
    blocks.forEach(b => { scene.remove(b); disposeMesh(b); }); debris.forEach(d => { scene.remove(d); disposeMesh(d); }); confetti.forEach(c => { scene.remove(c); disposeMesh(c); });
    blocks = []; debris = []; confetti = []; currentBlock = null;
}

function saveCurrentScoreIfNeeded() {
    if (score > 0) {
        if (score > highScore) { highScore = score; localStorage.setItem('towerHighScore', highScore); highScoreEl.innerText = `РЕКОРД: ${highScore}`; }
        // Сохраняем в лидерборд (упрощенно)
    }
}

function startGame(mode) {
    initAudio(); stopMusic(); clearScene();
    if (mode) gameMode = mode;
    score = 0; combo = 0; isFury = false; furyBlocksLeft = 0; document.body.classList.remove('fury-active');
    scoreEl.innerText = score; direction = 1; currentSpeed = BASE_SPEED; musicTempo = 110; gameState = 'playing'; currentBiomeIndex = 0;
    targetBgColor.set(BIOMES[0].bg); scene.background.set(BIOMES[0].bg); document.body.style.background = BIOMES[0].bg;
    document.body.classList.add('in-game');

    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }
    if (gameMode === 'time') {
        timeLeft = 60; timerEl.style.display = 'block'; updateTimerDisplay();
        timeAttackTimer = setInterval(() => { if (gameState !== 'playing') return; timeLeft--; updateTimerDisplay(); if (timeLeft <= 0) { clearInterval(timeAttackTimer); timeAttackTimer = null; triggerGameOver(); } }, 1000);
    } else { timerEl.style.display = 'none'; }

    modeLabel.innerText = { classic: 'КЛАССИКА', time: 'НА ВРЕМЯ' }[gameMode];
    startScreen.style.display = 'none'; gameOverEl.style.display = 'none'; pauseScreen.style.display = 'none';
    camera.position.set(20, 25, 20); camera.lookAt(0, 0, 0);
    if (showTutorialHint) tutorialEl.style.display = 'block';

    createBaseBlock(); startMusic(); updateQuest('games', 1);
}

function goToMenu() {
    if (gameState === 'playing') saveCurrentScoreIfNeeded();
    stopMusic(); clearScene(); gameState = 'menu';
    document.body.classList.remove('in-game', 'fury-active');
    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }
    gameOverEl.style.display = 'none'; pauseScreen.style.display = 'none'; shopScreen.style.display = 'none'; startScreen.style.display = 'flex';
    scene.background.set(BIOMES[0].bg); document.body.style.background = BIOMES[0].bg;
    camera.position.set(20, 25, 20); camera.lookAt(0, 0, 0);
    windGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
}

function triggerGameOver() {
    if (gameState === 'gameover') return;
    gameState = 'gameover'; playSound('gameover'); stopMusic(); shakeIntensity = 0.8;
    document.body.classList.remove('in-game', 'fury-active');
    if (timeAttackTimer) { clearInterval(timeAttackTimer); timeAttackTimer = null; }
    finalScoreVal.innerText = score;
    setTimeout(() => { gameOverEl.style.display = 'flex'; }, 800);
    triggerHaptic('error');
}

function togglePause() {
    if (gameState === 'playing') {
        gameState = 'paused'; pauseScreen.style.display = 'flex';
        document.body.classList.remove('in-game');
        if (timeAttackTimer) clearInterval(timeAttackTimer);
    } else if (gameState === 'paused') {
        gameState = 'playing'; pauseScreen.style.display = 'none';
        document.body.classList.add('in-game');
        if (gameMode === 'time') {
            timeAttackTimer = setInterval(() => { if (gameState !== 'playing') return; timeLeft--; updateTimerDisplay(); if (timeLeft <= 0) { clearInterval(timeAttackTimer); triggerGameOver(); } }, 1000);
        }
    }
}

// ==========================================
// INPUT & BUTTONS
// ==========================================
function handleInput(e) {
    const target = e.target;
    if (target && target.closest && target.closest('button, .mode-btn, #top-right-controls, .modal')) return;
    if (target && target.closest && target.closest('#start-screen, #game-over, #pause-screen, #shop-screen')) return;
    if (gameState === 'playing') {
        if (e.type === 'touchstart') e.preventDefault();
        dropBlock();
    }
}
window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', handleInput, { passive: false });

document.querySelectorAll('.mode-btn').forEach(btn => {
    safeClick(btn, () => { startGame(btn.dataset.mode); });
});

safeClick($('restart-btn'), () => startGame());
safeClick($('menu-btn'), () => goToMenu());
safeClick(pauseBtn, () => togglePause());
safeClick($('pause-resume'), () => togglePause());
safeClick($('pause-menu'), () => goToMenu());
safeClick(menuToggleBtn, () => { if (gameState === 'playing' || gameState === 'paused') goToMenu(); });
safeClick($('shop-btn'), () => { renderShop(); shopScreen.style.display = 'flex'; });
safeClick($('close-shop'), () => { shopScreen.style.display = 'none'; startScreen.style.display = 'flex'; });
safeClick($('challenge-btn'), () => {
    const text = `Я построил башню на ${score} этажей в MEGA HYPE! Слабо побить мой рекорд? 🏗️`;
    const url = window.location.href;
    if (tg) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
    else window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
});

safeClick(muteBtn, () => {
    isMuted = !isMuted; localStorage.setItem('towerMuted', isMuted);
    muteBtn.innerText = isMuted ? '🔇' : '🔊';
    if (isMuted) { stopMusic(); windGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); } else if (gameState === 'playing') startMusic();
});
muteBtn.innerText = isMuted ? '🔇' : '🔊';

function onResize() {
    if (!camera || !renderer) return;
    const aspect = window.innerWidth / window.innerHeight; const d = 10;
    camera.left = -d * aspect; camera.right = d * aspect; camera.top = d; camera.bottom = -d;
    camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateTimerDisplay() { timerEl.innerText = `⏱ ${timeLeft}`; timerEl.style.color = timeLeft <= 10 ? '#EF476F' : '#06D6A0'; }

// INIT
initThree();
loadQuests();
animate();
</script>
